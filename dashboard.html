<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iMessage Hub - Dashboard</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="saas-container">
    
    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">iM</div>
        <h2>iMessage Hub</h2>
      </div>
      
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item disabled">Messages <span class="badge">Soon</span></a>
        <a href="#" class="nav-item disabled">Contacts <span class="badge">Soon</span></a>
        <a href="#" class="nav-item disabled">Campaigns <span class="badge">Soon</span></a>
        <a href="#" class="nav-item disabled">Billing <span class="badge">Soon</span></a>
      </nav>
      
      <div class="sidebar-bottom">
        <button id="logoutButton" class="secondary-button logout-sidebar">Sign out</button>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
      <header class="topbar-modern">
        <div>
          <h1 class="page-title">Overview</h1>
        </div>
        <div class="topbar-right">
          <span id="accountStatus" class="status-indicator">ACTIVE</span>
        </div>
      </header>

      <div class="content-scroll">
        <section class="welcome-panel">
          <div>
            <span class="eyebrow">YOUR WORKSPACE</span>
            <h2 id="welcomeName">Loading...</h2>
            <p id="welcomeEmail">Loading...</p>
          </div>
        </section>

        <section class="stats-grid">
          <article class="stat-card">
            <span>Wallet Balance</span>
            <strong id="walletBalance">...</strong>
          </article>
          <article class="stat-card">
            <span>Account Role</span>
            <strong id="accountRole">...</strong>
          </article>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Account Information</h2>
          </div>
          <div class="info-grid">
            <div>
              <span>User ID</span>
              <strong id="userId">...</strong>
            </div>
            <div>
              <span>Created Date</span>
              <strong id="createdAt">...</strong>
            </div>
          </div>
        </section>
        
        <div id="dashboardMessage" class="message hidden"></div>
      </div>
    </main>
    
  </div>
  <script type="module" src="/src/dashboard.js"></script>
</body>
</html>
