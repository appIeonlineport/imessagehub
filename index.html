<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iMessage Hub — Enterprise Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="auth-body">
    <div class="tech-ambient-glow top-left"></div>
    <div class="tech-ambient-glow bottom-right"></div>

    <div class="auth-container">
      <!-- Brand Header -->
      <div class="auth-brand">
        <div class="brand-logo-glow">
          <div class="brand-logo-animated">
            <div class="logo-pulse-ring"></div>
            <svg
              class="brand-svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 3C6.477 3 2 6.94 2 11.8C2 14.54 3.443 16.97 5.7 18.52L4.5 21.5L8.5 19.98C9.61 20.37 10.78 20.6 12 20.6C17.523 20.6 22 16.66 22 11.8C22 6.94 17.523 3 12 3Z"
                fill="url(#authCyberGrad)"
              />
              <defs>
                <linearGradient id="authCyberGrad" x1="2" y1="3" x2="22" y2="21" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#00F0FF" />
                  <stop offset="0.5" stop-color="#007AFF" />
                  <stop offset="1" stop-color="#A855F7" />
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
        <h1 class="brand-title">iMessage Hub</h1>
        <p class="brand-subtitle">Enterprise Apple Messaging & Relay Platform</p>
      </div>

      <!-- Auth Card -->
      <div class="auth-card">
        <!-- Tab Switcher -->
        <div class="auth-tabs" role="tablist">
          <button id="tabLogin" class="tab-btn active" role="tab" type="button">Sign In</button>
          <button id="tabSignup" class="tab-btn" role="tab" type="button">Create Account</button>
        </div>

        <div id="authMessage" class="auth-alert hidden" role="alert"></div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" novalidate>
          <div class="form-group">
            <label for="loginEmail" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="loginEmail"
                name="email"
                class="form-input"
                placeholder="name@example.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="loginPassword" class="form-label">Password</label>
              <a href="#" class="forgot-link" tabindex="-1">Forgot?</a>
            </div>
            <div class="input-wrapper">
              <input
                type="password"
                id="loginPassword"
                name="password"
                class="form-input"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">
            <span class="btn-text">Sign In to Workspace</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form hidden" novalidate>
          <div class="form-group">
            <label for="signupFullName" class="form-label">Full Name</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="signupFullName"
                name="fullName"
                class="form-input"
                placeholder="John Doe"
                autocomplete="name"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="signupEmail" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="signupEmail"
                name="email"
                class="form-input"
                placeholder="name@example.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="signupPassword" class="form-label">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="signupPassword"
                name="password"
                class="form-input"
                placeholder="At least 6 characters"
                autocomplete="new-password"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="signupConfirmPassword" class="form-label">Confirm Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="signupConfirmPassword"
                name="confirmPassword"
                class="form-input"
                placeholder="Re-enter password"
                autocomplete="new-password"
                required
              />
            </div>
          </div>

          <button type="submit" id="signupSubmitBtn" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">
            <span class="btn-text">Create Account</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </form>
      </div>

      <!-- Footer -->
      <footer class="auth-footer">
        <div class="security-badge">
          <span>🔒 Supabase JWT Auth • End-to-End Encrypted</span>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
